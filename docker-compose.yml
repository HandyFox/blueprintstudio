# Blueprint Studio on a VPS next to your other apps.
#
#   cp .env.example .env      # then edit it
#   docker compose up -d --build
#
# The app listens on 127.0.0.1:${BPS_PORT} only — put your reverse proxy
# (nginx, Caddy, Traefik…) in front of it. See deploy/ for examples.
services:
  blueprintstudio:
    build: .
    image: blueprintstudio:latest
    container_name: blueprintstudio
    restart: unless-stopped
    env_file: .env
    environment:
      BLUEPRINT_STUDIO_DATA_DIR: /data
    ports:
      - "127.0.0.1:${BPS_PORT:-8070}:8000"
    volumes:
      - ./data:/data
    # --- Using Traefik instead of a port? Remove `ports:` above, put the
    # --- service on your Traefik network, and uncomment/adjust these:
    # networks: [proxy]
    # labels:
    #   - traefik.enable=true
    #   - traefik.http.routers.bps.rule=Host(`plans.example.com`)
    #   - traefik.http.routers.bps.entrypoints=websecure
    #   - traefik.http.routers.bps.tls.certresolver=letsencrypt
    #   - traefik.http.services.bps.loadbalancer.server.port=8000

# networks:
#   proxy:
#     external: true
