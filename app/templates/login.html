<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <base href="{{ base_path }}">
    <title>Sign in · Blueprint Studio</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; }
        body {
            font: 14px/1.4 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            color: #e9e7e2;
            background:
                linear-gradient(rgba(23,25,29,0.92), rgba(23,25,29,0.92)),
                repeating-linear-gradient(0deg, transparent 0 23px, #2a2f37 23px 24px),
                repeating-linear-gradient(90deg, transparent 0 23px, #2a2f37 23px 24px),
                #17191d;
            display: flex; align-items: center; justify-content: center;
        }
        .card {
            width: min(360px, 92vw);
            background: #1e2126; border: 1px solid #353a43; border-radius: 14px;
            padding: 28px 28px 22px; box-shadow: 0 24px 60px rgba(0,0,0,0.5);
        }
        .brand { font-weight: 800; letter-spacing: 0.08em; font-size: 15px; }
        .brand span { font-weight: 400; color: #a3a8b0; }
        h1 { font-size: 13px; font-weight: 400; color: #a3a8b0; margin: 4px 0 22px; }
        label { display: block; font-size: 12px; color: #a3a8b0; margin: 12px 0 5px; }
        input {
            width: 100%; padding: 9px 11px; font: inherit; color: #e9e7e2;
            background: #17191d; border: 1px solid #434954; border-radius: 7px;
        }
        input:focus { outline: none; border-color: #3b82f6; }
        button {
            width: 100%; margin-top: 20px; padding: 10px; font: inherit; font-weight: 600;
            color: #fff; background: #3b82f6; border: 0; border-radius: 7px; cursor: pointer;
        }
        button:hover { background: #60a5fa; }
        button:disabled { opacity: 0.6; cursor: default; }
        .error {
            margin-top: 14px; padding: 8px 10px; font-size: 13px; border-radius: 7px;
            color: #fecaca; background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.35);
        }
        .hint { margin-top: 18px; font-size: 12px; color: #737a85; text-align: center; }
        .hidden { display: none; }
    </style>
</head>
<body>
<main class="card">
    <div class="brand">BLUEPRINT <span>STUDIO</span></div>
    <h1>Sign in to continue</h1>
    <form id="login-form" autocomplete="on">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" autofocus required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <div id="error" class="error hidden" role="alert"></div>
        <button type="submit" id="submit">Sign in</button>
    </form>
    <div class="hint">No account? Ask your administrator to add you.</div>
</main>
<script>
    const form = document.getElementById('login-form');
    const errorBox = document.getElementById('error');
    const submit = document.getElementById('submit');
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorBox.classList.add('hidden');
        submit.disabled = true;
        submit.textContent = 'Signing in…';
        try {
            const res = await fetch('api/login', {
                method: 'POST', credentials: 'same-origin',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('username').value.trim(),
                    password: document.getElementById('password').value,
                }),
            });
            const body = await res.json().catch(() => ({}));
            if (res.ok) { window.location.href = document.baseURI; return; }
            errorBox.textContent = body.error || 'Sign in failed.';
        } catch (err) {
            errorBox.textContent = 'Could not reach the server.';
        }
        errorBox.classList.remove('hidden');
        submit.disabled = false;
        submit.textContent = 'Sign in';
    });
</script>
</body>
</html>
