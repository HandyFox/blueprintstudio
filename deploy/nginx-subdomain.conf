# /etc/nginx/sites-available/blueprintstudio  (then symlink into sites-enabled)
# Blueprint Studio on its own subdomain, e.g. https://plans.example.com
# Get a certificate with:  sudo certbot --nginx -d plans.example.com
server {
    listen 80;
    server_name plans.example.com;

    client_max_body_size 32m;          # large drawings / PDF export payloads

    location / {
        proxy_pass http://127.0.0.1:8070;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
