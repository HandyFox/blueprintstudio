# Blueprint Studio under a path on a domain you already serve, e.g.
# https://example.com/blueprints/  — paste this inside that site's server { }.
#
# Option A (recommended): let nginx tell the app where it is mounted.
location /blueprints/ {
    client_max_body_size 32m;
    proxy_pass http://127.0.0.1:8070/;            # trailing slash strips /blueprints
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Prefix /blueprints;
    proxy_read_timeout 120s;
}
location = /blueprints { return 301 /blueprints/; }

# Option B: don't strip the path in nginx (proxy_pass http://127.0.0.1:8070;
# with no trailing slash) and instead set BLUEPRINT_STUDIO_PREFIX=/blueprints
# in .env. Use one option or the other, not both.
